name: Generate Bomberman Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution graph
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = await fetch('https://github-contributions-api.jogruber.de/v4/SoumyadipSil?y=last');
            const data = await response.json();
            const contributions = data.contributions || [];
            const levels = ['#ebedf0', '#9be9a8', '#40c463', '#30a14e', '#216e39'];
            const cells = contributions.map((day, index) => {
              const column = Math.floor(index / 7);
              const row = index % 7;
              const x = 24 + column * 13;
              const y = 26 + row * 13;
              const level = Math.min(day.level || 0, 4);
              return `<rect x="${x}" y="${y}" width="10" height="10" rx="2" fill="${levels[level]}"/>`;
            }).join('');
            const svg = (dark) => `<?xml version="1.0" encoding="UTF-8"?>
            <svg xmlns="http://www.w3.org/2000/svg" width="760" height="145" viewBox="0 0 760 145">
              <rect width="760" height="145" rx="8" fill="${dark ? '#0d1117' : '#ffffff'}"/>
              <text x="24" y="17" font-family="sans-serif" font-size="12" font-weight="bold" fill="${dark ? '#f0f6fc' : '#24292f'}">Bomberman contribution graph</text>
              ${cells}
              <circle cx="710" cy="83" r="13" fill="#f2c94c" stroke="#24292f" stroke-width="2"/>
              <circle cx="706" cy="80" r="2" fill="#24292f"/>
              <circle cx="714" cy="80" r="2" fill="#24292f"/>
              <path d="M704 88 Q710 93 716 88" fill="none" stroke="#24292f" stroke-width="2"/>
              <path d="M710 70 V62 M705 65 L710 60 L715 65" fill="none" stroke="#f2c94c" stroke-width="3"/>
            </svg>`;
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/bomberman-contribution-graph.svg', svg(false));
            fs.writeFileSync('dist/bomberman-contribution-graph-dark.svg', svg(true));

      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
